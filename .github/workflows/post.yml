name: "Post to Bluesky"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run build
      - name: Send post
        run: npm start
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling the workflow through the API resets that timer.
      - name: Keep scheduled workflow enabled
        if: ${{ !cancelled() }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/post.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
